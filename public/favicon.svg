<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ak-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" stroke="#2563eb" stroke-width="2"/>
  <!-- Decorative subtle tech grid or accent -->
  <circle cx="20" cy="20" r="2" fill="#f97316" opacity="0.8"/>
  <circle cx="80" cy="80" r="2" fill="#2563eb" opacity="0.8"/>
  <!-- Stylized Monogram AK -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M 32 72 L 44 28 L 56 72" stroke="url(#ak-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 37 57 L 51 57" stroke="url(#ak-grad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Letter K interlocking -->
    <path d="M 60 28 L 60 72" stroke="url(#ak-grad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 76 34 L 60 52 L 77 72" stroke="url(#ak-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
